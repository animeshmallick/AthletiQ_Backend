name: CI

on:
  push:
    branches: [mainline]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrations are in sync with the schema
        run: |
          DATABASE_URL=postgresql://ci:ci@localhost:5432/ci npx drizzle-kit check
          DATABASE_URL=postgresql://ci:ci@localhost:5432/ci npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Test (unit + API against in-memory Postgres) with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov-report
          retention-days: 7

  docker:
    # Proves the production image builds and boots, since deploys build it on the server.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA::7} -t athletiq-api:ci .
      - name: Image starts and validates its config
        run: |
          # Without a real database the app must refuse to boot with a clear config error, not crash
          # on a missing module. That proves the runtime image (dist + prod deps) is complete.
          set +e
          out=$(docker run --rm athletiq-api:ci 2>&1)
          code=$?
          echo "$out"
          [ "$code" -ne 0 ] && echo "$out" | grep -q "Invalid environment configuration"
