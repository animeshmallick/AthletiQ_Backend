name: Deploy

# Deploys mainline to the EC2 server after CI passes. Also runnable by hand from the Actions tab
# ("Run workflow") to redeploy the latest mainline.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [mainline]
  workflow_dispatch:

# Deploys run one after another, never in parallel, and a running deploy is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mainline') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://api.edupilots.in/health
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$EC2_KNOWN_HOSTS" ]; then
            echo "::error::Set the EC2_SSH_KEY and EC2_KNOWN_HOSTS secrets (see deploy.md, section 9)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ env.SHA }} on the server
        env:
          EC2_HOST: ${{ vars.EC2_HOST || 'api.edupilots.in' }}
          EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" \
            "set -e; cd ~/apps/athletiq-api; git fetch --prune -q origin;
             git merge-base --is-ancestor $SHA origin/mainline || { echo 'commit is not on mainline'; exit 1; };
             git checkout -q --detach $SHA; bash scripts/deploy.sh"

      - name: Public health check
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://api.edupilots.in/ready
